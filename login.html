<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar - Chess Academy</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div id="header"></div>

  <main class="login-page">
    <section class="login-container">
      <h1>Entrar</h1>

      <form id="login-form" class="login-form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="seu@exemplo.com" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required>

        <button type="submit" class="btn-primary btn-submit">Entrar</button>
      </form>

      <p class="note">Ainda não tem conta? <a href="tactics-course.html">Cadastre-se</a></p>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
